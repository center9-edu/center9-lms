name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: center9
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: center9_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U center9 -d center9_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://center9:ci-only@localhost:5432/center9_ci?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Apply migrations to a fresh database
        run: pnpm db:migrate:deploy

      - name: Check that schema.prisma matches the migrations
        run: pnpm --filter @center9/database exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
