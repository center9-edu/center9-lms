name: center9-lms

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: center9
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: center9_lms
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U center9 -d center9_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
